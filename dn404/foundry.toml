# DN-404 (Vectorized) example, configured for Monad.
# Requires Foundry v1.8.0+. network = "monad" enables Monad execution rules
# (hardfork defaults to MonadTen); it replaces the old evm_version workaround.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
network = "monad"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 1000
# Embed full source in contract metadata for Sourcify verification.
use_literal_content = true

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
monad = "https://rpc.monad.xyz"
